<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient)"/>

  <!-- Spark/Lightning Symbol -->
  <path d="M280 100L200 260H240L220 380L320 220H280L300 100L280 100Z"
        fill="#FFF"
        stroke="#FCD34D"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Accent Stars -->
  <circle cx="380" cy="150" r="12" fill="#FCD34D" opacity="0.8"/>
  <circle cx="140" cy="180" r="8" fill="#FCD34D" opacity="0.6"/>
  <circle cx="360" cy="340" r="10" fill="#FCD34D" opacity="0.7"/>
  <circle cx="150" cy="360" r="8" fill="#FCD34D" opacity="0.6"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DB2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
